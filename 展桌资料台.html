<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>展桌资料台｜制作文件管理与供应商确认</title>
<meta name="description" content="统计展桌制作信息，管理画面与图纸，并生成供应商确认单。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%231d593b'/><text x='16' y='23' text-anchor='middle' fill='%23dfff4f' font-size='20' font-weight='bold'>展</text></svg>">
<style>
:root {
  --ink: #17211b;
  --muted: #68726c;
  --line: #d9ded9;
  --paper: #f4f3ee;
  --white: #fff;
  --green: #1d593b;
  --lime: #dfff4f;
  --orange: #e87722;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: linear-gradient(rgba(23,33,27,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(23,33,27,.028) 1px, transparent 1px), var(--paper);
  background-size: 28px 28px;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }

/* Topbar */
.topbar {
  height: 64px;
  padding: 0 4vw;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(255,255,255,.92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand>div { display: flex; flex-direction: column; gap: 2px; }
.brand strong { font-size: 17px; letter-spacing: .04em; }
.brand small { color: var(--muted); font-size: 11px; }
.brand-mark {
  display: grid; place-items: center;
  width: 38px; height: 38px;
  color: var(--lime); background: var(--green);
  font-weight: 800; font-size: 18px;
  border-radius: 2px;
}
.top-actions { display: flex; align-items: center; gap: 10px; }
.button {
  border: 0; min-height: 40px; padding: 0 18px;
  border-radius: 4px; font-weight: 700;
  transition: transform .2s, background .2s;
}
.button:hover { transform: translateY(-1px); }
.button.ghost { border: 1px solid var(--line); background: var(--white); }
.button.primary { color: white; background: var(--green); }
.button.primary:hover { background: #12462d; }
.save-state {
  font-size: 12px; color: #95621d;
  display: flex; align-items: center; gap: 7px; margin-right: 6px;
}
.save-state i { width: 7px; height: 7px; border-radius: 50%; background: #f3a51d; }
.save-state.ok { color: var(--muted); }
.save-state.ok i { background: #4a9a6b; }

/* Workspace */
.workspace { width: min(1440px, 92vw); margin: 0 auto; padding: 32px 0 64px; }
.intro {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 32px; margin-bottom: 32px;
}
.eyebrow, .section-label {
  margin: 0 0 8px; color: var(--green);
  font-weight: 800; font-size: 10px; letter-spacing: .2em;
}
.intro h1 { margin: 0; font-size: clamp(28px, 3.4vw, 48px); letter-spacing: -.045em; line-height: 1.08; }
.intro>div>p:last-child { color: var(--muted); margin: 12px 0 0; }
.stats { display: flex; background: var(--white); border: 1px solid var(--line); }
.stats div { min-width: 116px; padding: 16px 20px; border-left: 1px solid var(--line); }
.stats div:first-child { border-left: 0; }
.stats strong, .stats span { display: block; }
.stats strong { font-size: 26px; line-height: 1; }
.stats span { color: var(--muted); font-size: 11px; margin-top: 7px; }
.stats .warn strong { color: var(--orange); }

/* Content Grid */
.content-grid {
  display: grid;
  grid-template-columns: 310px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.panel {
  background: var(--white);
  border: 1px solid var(--line);
  box-shadow: 0 14px 40px rgba(22,38,29,.05);
}
.panel-head {
  padding: 24px 24px 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.panel-head h2 { margin: 0; font-size: 21px; }
.circle-button {
  width: 38px; height: 38px; border: 0; border-radius: 50%;
  color: var(--lime); background: var(--green); font-size: 24px;
  display: grid; place-items: center; line-height: 1;
}
.circle-button:hover { background: #12462d; }
.search {
  margin: 18px; padding: 0 12px; height: 40px;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: #fafaf7;
}
.search span { font-size: 20px; color: var(--muted); }
.search input {
  border: 0; outline: 0; background: transparent;
  min-width: 0; width: 100%; font-size: 13px;
}
.record-list { padding: 0 10px; min-height: 310px; max-height: 60vh; overflow-y: auto; }
.record {
  width: 100%; padding: 15px 12px;
  display: flex; align-items: center; gap: 12px;
  text-align: left; border: 0;
  border-bottom: 1px solid #ecefea; background: transparent;
}
.record:hover, .record.active { background: #f4f8e8; }
.record-index { color: #9ca39f; font: 11px monospace; flex-shrink: 0; }
.record-copy { flex: 1; min-width: 0; }
.record-copy strong, .record-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.record-copy strong { font-size: 14px; }
.record-copy small { color: var(--muted); font-size: 11px; margin-top: 4px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #e5a34a; flex: 0 0 auto; }
.status-dot.ready { background: #4a9a6b; }
.legend {
  padding: 16px 20px; display: flex; gap: 18px;
  color: var(--muted); font-size: 10px; border-top: 1px solid var(--line);
}
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; }

/* Form Panel */
.form-panel { padding-bottom: 24px; }
.form-title { background: #fbfcf8; }
.badge {
  font-size: 11px; padding: 6px 11px;
  color: #9b651b; background: #fff2d9; border-radius: 20px;
}
.badge.complete { color: #246544; background: #e2f3e8; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 26px 28px 0; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field>span, .dimension-row label>span { color: var(--muted); font-size: 11px; font-weight: 700; }
.field input, .field textarea, .dimension-row input, .field select {
  width: 100%; padding: 12px 13px;
  border: 1px solid var(--line); border-radius: 3px;
  outline: 0; background: #fcfcfa;
  transition: border-color .2s, box-shadow .2s;
}
.field input:focus, .field textarea:focus, .dimension-row input:focus, .field select:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(29,89,59,.08);
}
.field textarea { min-height: 84px; resize: vertical; }
.field.wide { margin: 22px 28px 0; }
.form-grid .field.wide { margin: 0; }
.subsection { margin: 26px 28px 0; padding-top: 22px; border-top: 1px solid var(--line); }
.subsection-title {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.subsection-title h3 { margin: 0; font-size: 14px; }
.subsection-title span { color: var(--muted); font-size: 10px; }
.dimension-row, .upload-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.dimension-row label { display: flex; flex-direction: column; gap: 7px; }
.dimension-row input { font-weight: 700; }
.format-options { display: flex; gap: 10px; flex-wrap: wrap; }
.format-options button {
  min-width: 92px; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); background: white;
  border-radius: 3px; font-weight: 700;
}
.format-options button i {
  width: 18px; height: 18px; display: grid; place-items: center;
  border: 1px solid #b9c0bb; border-radius: 2px;
  font-size: 11px; font-style: normal;
}
.format-options button.selected { border-color: var(--green); background: #f4f8e8; }
.format-options button.selected i { color: var(--lime); background: var(--green); border-color: var(--green); }
.upload-grid { grid-template-columns: 1fr 1fr; }
.upload-card {
  min-width: 0; position: relative; padding: 16px;
  display: flex; align-items: center; gap: 12px;
  border: 1px dashed #bdc6bf; background: #fbfcfa;
}
.upload-card.has-file { border-style: solid; border-color: #b7d1c0; background: #f5faf6; }
.file-icon {
  width: 34px; height: 40px; display: grid; place-items: center;
  color: var(--green); background: #e8efe9; font-weight: 800;
  clip-path: polygon(0 0, 75% 0, 100% 25%, 100% 100%, 0 100%);
  flex-shrink: 0;
}
.upload-copy { flex: 1; min-width: 0; }
.upload-copy strong, .upload-copy small, .upload-copy a { display: block; }
.upload-copy strong { font-size: 12px; margin-bottom: 5px; }
.upload-copy small, .upload-copy a { color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upload-copy a { color: var(--green); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.upload-copy a:hover { color: #12462d; }
.upload-action { color: var(--green); font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.upload-action input { display: none; }
.remove-file {
  position: absolute; top: 3px; right: 5px;
  border: 0; background: transparent; color: #9aa19c;
  font-size: 16px; line-height: 1;
}
.remove-file:hover { color: #a04e3f; }
.form-footer {
  margin: 24px 28px 0; padding-top: 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-top: 1px solid var(--line);
}
.text-danger { border: 0; background: transparent; color: #a04e3f; font-size: 11px; }
.text-danger:hover { text-decoration: underline; }
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  padding: 12px 24px; border-radius: 6px;
  background: var(--ink); color: white; font-size: 13px;
  z-index: 100; opacity: 0; transition: opacity .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Empty state */
.empty-state {
  padding: 48px 24px; text-align: center; color: var(--muted);
}
.empty-state p { margin: 0 0 16px; font-size: 13px; }

/* No items placeholder in list */
.no-items {
  padding: 32px 20px; text-align: center; color: var(--muted); font-size: 13px;
}

/* Print Sheet */
.print-sheet { display: none; }

@media (max-width: 900px) {
  .topbar { padding: 0 20px; }
  .save-state, .button.ghost { display: none; }
  .workspace { width: calc(100% - 28px); padding-top: 26px; }
  .intro { align-items: flex-start; flex-direction: column; }
  .stats { width: 100%; }
  .stats div { flex: 1; min-width: 0; padding: 13px; }
  .content-grid { grid-template-columns: 1fr; }
  .record-list { min-height: 0; max-height: 40vh; }
  .upload-grid { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .brand small { display: none; }
  .topbar .button.primary { padding: 0 12px; font-size: 12px; }
  .intro h1 { font-size: 28px; }
  .stats strong { font-size: 20px; }
  .form-grid, .upload-grid { grid-template-columns: 1fr; }
  .dimension-row { gap: 7px; }
  .panel-head, .form-grid { padding-left: 18px; padding-right: 18px; }
  .subsection, .field.wide, .form-footer { margin-left: 18px; margin-right: 18px; }
  .form-footer { flex-direction: column; align-items: flex-end; gap: 16px; }
}

@media print {
  @page { size: A4; margin: 14mm; }
  body { background: white; color: #111; font-size: 12pt; }
  .topbar, .workspace, .toast { display: none !important; }
  .print-sheet { display: block; font-size: 10.5pt; }
  .print-brand {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding-bottom: 8mm; border-bottom: 2px solid #1d593b;
  }
  .print-brand span { color: #1d593b; font-size: 8.5pt; letter-spacing: .08em; font-weight: 700; }
  .print-brand b { font-size: 22pt; letter-spacing: .08em; }
  .print-meta {
    display: flex; justify-content: space-between; gap: 10mm;
    padding: 5mm 0; color: #4e5550; font-size: 8.5pt;
  }
  .print-meta p { margin: 0; }
  .print-sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .print-sheet th, .print-sheet td {
    padding: 4mm; border: 1px solid #9da49f;
    text-align: left; vertical-align: top;
  }
  .print-sheet th { width: 22mm; background: #eef2ef; font-size: 9pt; }
  .note-cell { min-height: 25mm; }
  .confirm-box {
    margin-top: 7mm; padding: 5mm; border: 1px solid #9da49f;
  }
  .confirm-box h3 { margin: 0 0 4mm; font-size: 12pt; }
  .confirm-box p { margin: 3mm 0; }
  .writing-lines {
    height: 18mm; border-bottom: 1px solid #bbb;
    background: repeating-linear-gradient(transparent, transparent 8mm, #ddd 8mm, #ddd calc(8mm + 1px));
  }
  .signatures {
    display: grid; grid-template-columns: 2fr 1fr; gap: 8mm; margin-top: 11mm;
  }
  .signatures div { display: flex; align-items: flex-end; }
  .signatures i { flex: 1; height: 8mm; border-bottom: 1px solid #555; font-style: normal; }
  .print-sheet footer {
    position: fixed; bottom: 0; width: 100%;
    padding-top: 3mm; border-top: 1px solid #aaa;
    color: #666; font-size: 8pt;
  }
}
</style>
</head>
<body>

<main id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">展</span>
      <div><strong>展桌资料台</strong><small>制作文件管理与供应商确认</small></div>
    </div>
    <div class="top-actions">
      <span class="save-state ok" id="saveState"><i></i><span id="saveText">已保存到本机</span></span>
      <button class="button ghost" onclick="app.save()">保存资料</button>
      <button class="button primary" onclick="app.printConfirm()">生成确认 PDF</button>
    </div>
  </header>

  <div class="workspace">
    <section class="intro">
      <div>
        <p class="eyebrow">PRODUCTION DESK · 2026</p>
        <h1>把每一张展桌，交代清楚。</h1>
        <p>统一收集尺寸、画面和图纸，生成供应商可以直接确认的制作单。</p>
      </div>
      <div class="stats">
        <div><strong id="statTotal">0</strong><span>展桌项目</span></div>
        <div><strong id="statComplete">0</strong><span>资料齐全</span></div>
        <div id="statMissingWrap"><strong id="statMissing">0</strong><span>待补文件</span></div>
      </div>
    </section>

    <div class="content-grid">
      <!-- Left: List -->
      <section class="panel list-panel">
        <div class="panel-head">
          <div><p class="section-label">01 · 清单</p><h2>展桌统计</h2></div>
          <button class="circle-button" onclick="app.addItem()" aria-label="新增展桌">+</button>
        </div>
        <label class="search">
          <span>⌕</span>
          <input id="searchInput" placeholder="搜索料号或名称" oninput="app.filter()">
        </label>
        <div class="record-list" id="recordList">
          <div class="no-items">暂无展桌记录，点击 + 添加</div>
        </div>
        <div class="legend">
          <span><i class="status-dot ready"></i>资料齐全</span>
          <span><i class="status-dot"></i>待补资料</span>
        </div>
      </section>

      <!-- Right: Form -->
      <section class="panel form-panel" id="formPanel">
        <div class="panel-head form-title">
          <div><p class="section-label">02 · 制作信息</p><h2 id="formTitle">新建展桌</h2></div>
          <span class="badge" id="formBadge">填写中</span>
        </div>

        <div class="form-grid">
          <label class="field wide"><span>展桌料号</span>
            <input id="fPartNo" placeholder="例如 ZT-001" oninput="app.onField('partNo')"></label>
          <label class="field wide"><span>展桌名称</span>
            <input id="fName" placeholder="请输入名称" oninput="app.onField('name')"></label>
          <label class="field"><span>数量</span>
            <input id="fQuantity" type="number" min="1" value="1" oninput="app.onField('quantity')"></label>
          <label class="field"><span>计划入库时间</span>
            <input id="fStockDate" type="date" oninput="app.onField('stockDate')"></label>
        </div>

        <div class="subsection">
          <div class="subsection-title"><h3>成品尺寸</h3><span>单位：mm</span></div>
          <div class="dimension-row">
            <label><span>长 L</span><input id="fLength" type="number" placeholder="0" oninput="app.onField('length')"></label>
            <label><span>宽 W</span><input id="fWidth" type="number" placeholder="0" oninput="app.onField('width')"></label>
            <label><span>高 H</span><input id="fHeight" type="number" placeholder="0" oninput="app.onField('height')"></label>
          </div>
        </div>

        <div class="subsection">
          <div class="subsection-title"><h3>交付文件格式</h3><span>可多选</span></div>
          <div class="format-options" id="formatOptions">
            <button data-fmt="PDF" onclick="app.toggleFormat('PDF')"><i></i>PDF</button>
            <button data-fmt="AI" onclick="app.toggleFormat('AI')"><i></i>AI</button>
            <button data-fmt="CDR" onclick="app.toggleFormat('CDR')"><i></i>CDR</button>
            <button data-fmt="PSD" onclick="app.toggleFormat('PSD')"><i></i>PSD</button>
          </div>
        </div>

        <div class="subsection">
          <div class="subsection-title"><h3>制作文件</h3><span>上传后可直接下载核对</span></div>
          <div class="upload-grid">
            <div class="upload-card" id="artworkCard">
              <div class="file-icon" id="artworkIcon">＋</div>
              <div class="upload-copy">
                <strong>画面文件</strong>
                <small id="artworkHint">仅 AI 格式</small>
                <a id="artworkLink" style="display:none" href="#" download></a>
              </div>
              <label class="upload-action">上传<input type="file" accept=".ai,application/postscript" onchange="app.uploadFile('artwork', event)"></label>
              <button class="remove-file" id="artworkRemove" style="display:none" onclick="app.removeFile('artwork')" aria-label="移除画面文件">×</button>
            </div>
            <div class="upload-card" id="drawingCard">
              <div class="file-icon" id="drawingIcon">＋</div>
              <div class="upload-copy">
                <strong>尺寸图纸</strong>
                <small id="drawingHint">仅 PDF 格式</small>
                <a id="drawingLink" style="display:none" href="#" download></a>
              </div>
              <label class="upload-action">上传<input type="file" accept=".pdf,application/pdf" onchange="app.uploadFile('drawing', event)"></label>
              <button class="remove-file" id="drawingRemove" style="display:none" onclick="app.removeFile('drawing')" aria-label="移除尺寸图纸">×</button>
            </div>
          </div>
        </div>

        <label class="field wide"><span>制作备注</span>
          <textarea id="fNote" placeholder="填写材质、工艺、安装或包装等补充要求" oninput="app.onField('note')"></textarea></label>

        <div class="form-footer">
          <button class="text-danger" onclick="app.removeSelected()">删除当前记录</button>
          <button class="button primary" onclick="app.printConfirm()">预览并生成供应商确认单</button>
        </div>
      </section>
    </div>
  </div>

  <!-- Print Sheet (hidden, only visible when printing) -->
  <section class="print-sheet" id="printSheet"></section>

  <div class="toast" id="toast"></div>
</main>

<script>
const STORAGE_KEY = 'expo_table_data_v1';
const MAX_FILE_SIZE = 8 * 1024 * 1024; // 8MB per file

let items = [];
let selectedId = null;
let filterText = '';
let saveTimer = null;

function uuid() {
  return crypto.randomUUID ? crypto.randomUUID() :
    'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
}

function emptyTable() {
  return {
    id: uuid(),
    partNo: '', name: '', quantity: 1, stockDate: '',
    length: '', width: '', height: '',
    formats: ['PDF'],
    artwork: null,   // {name, dataUrl}
    drawing: null,   // {name, dataUrl}
    note: ''
  };
}

function isComplete(item) {
  return !!(item.partNo && item.name && item.quantity && item.stockDate &&
    item.length && item.width && item.height &&
    item.formats.length && item.artwork && item.drawing);
}

const app = {
  get selected() {
    return items.find(i => i.id === selectedId) || items[0] || null;
  },

  init() {
    this.load();
    if (!items.length) {
      // Add a sample item for first-time users
      const sample = emptyTable();
      sample.partNo = 'ZT-001';
      sample.name = '新品展示桌';
      sample.quantity = 2;
      sample.stockDate = '2026-08-15';
      sample.length = '1800';
      sample.width = '800';
      sample.height = '750';
      sample.formats = ['PDF', 'AI'];
      sample.note = '桌角做圆角处理；画面安装前请再次核对实际尺寸。';
      items = [sample];
      this.save();
    }
    selectedId = items[0].id;
    this.render();
    this.bindAutoSave();
    window.addEventListener('beforeunload', () => this.save());
  },

  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) items = JSON.parse(raw);
    } catch(e) {
      console.warn('Failed to load data:', e);
      items = [];
    }
  },

  save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      this.setSaveState(true);
    } catch(e) {
      if (e.name === 'QuotaExceededError') {
        this.toast('存储空间不足，请删除部分文件后重试');
      }
      this.setSaveState(false);
    }
  },

  setSaveState(ok) {
    const el = document.getElementById('saveState');
    const txt = document.getElementById('saveText');
    el.className = 'save-state' + (ok ? ' ok' : '');
    txt.textContent = ok ? '已保存到本机' : '有未保存修改';
  },

  bindAutoSave() {
    // Save on any input change (debounced)
    document.addEventListener('input', () => {
      this.setSaveState(false);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => this.save(), 800);
    });
  },

  addItem() {
    const created = emptyTable();
    items.push(created);
    selectedId = created.id;
    this.render();
    this.save();
    this.toast('已添加新展桌');
  },

  removeSelected() {
    const sel = this.selected;
    if (!sel) return;
    if (!confirm(`确定删除「${sel.name || '未命名展桌'}」吗？此操作不可撤销。`)) return;
    items = items.filter(i => i.id !== selectedId);
    if (!items.length) {
      const created = emptyTable();
      items = [created];
      selectedId = created.id;
    } else {
      selectedId = items[0].id;
    }
    this.render();
    this.save();
    this.toast('已删除');
  },

  selectItem(id) {
    selectedId = id;
    this.renderForm();
  },

  filter() {
    filterText = document.getElementById('searchInput').value;
    this.renderList();
  },

  toggleFormat(fmt) {
    const sel = this.selected;
    if (!sel) return;
    if (sel.formats.includes(fmt)) {
      sel.formats = sel.formats.filter(f => f !== fmt);
    } else {
      sel.formats = [...sel.formats, fmt];
    }
    this.renderForm();
    this.renderList();
    this.setSaveState(false);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => this.save(), 800);
  },

  onField(key) {
    const sel = this.selected;
    if (!sel) return;
    const el = document.getElementById('f' + key.charAt(0).toUpperCase() + key.slice(1));
    if (!el) return;
    let val = el.value;
    if (key === 'quantity') val = parseInt(val) || 1;
    sel[key] = val;
    this.renderList();
    this.updateStats();
    this.updateBadge();
  },

  uploadFile(kind, event) {
    const file = event.target.files?.[0];
    if (!file) return;

    // Validate format: artwork=AI only, drawing=PDF only
    const ext = '.' + file.name.split('.').pop().toLowerCase();
    if (kind === 'artwork' && ext !== '.ai' && file.type !== 'application/postscript') {
      this.toast('画面文件只接受 AI 格式');
      event.target.value = '';
      return;
    }
    if (kind === 'drawing' && ext !== '.pdf' && file.type !== 'application/pdf') {
      this.toast('尺寸图纸只接受 PDF 格式');
      event.target.value = '';
      return;
    }

    if (file.size > MAX_FILE_SIZE) {
      this.toast('文件超过 8MB 限制，请压缩后重试');
      event.target.value = '';
      return;
    }
    const sel = this.selected;
    if (!sel) return;
    const reader = new FileReader();
    reader.onload = () => {
      sel[kind] = { name: file.name, dataUrl: reader.result, size: file.size, type: file.type };
      this.renderForm();
      this.renderList();
      this.updateStats();
      this.updateBadge();
      this.save();
      this.toast(`已上传：${file.name}`);
    };
    reader.onerror = () => this.toast('文件读取失败，请重试');
    reader.readAsDataURL(file);
  },

  removeFile(kind) {
    const sel = this.selected;
    if (!sel) return;
    sel[kind] = null;
    this.renderForm();
    this.renderList();
    this.updateStats();
    this.updateBadge();
    this.save();
    this.toast('已移除文件');
  },

  printConfirm() {
    const sel = this.selected;
    if (!sel) { this.toast('请先选择展桌'); return; }
    const today = new Date().toLocaleDateString('zh-CN');
    let confirmSheet = document.getElementById('printSheet');
    confirmSheet.innerHTML = `
      <div class="print-brand"><span>展桌制作 / SUPPLIER CONFIRMATION</span><b>制作信息确认单</b></div>
      <div class="print-meta"><p>请供应商依据本单信息核对、排产并制作。如有疑问，请在制作前反馈。</p><span>生成日期：${today}</span></div>
      <table><tbody>
        <tr><th>展桌料号</th><td>${sel.partNo || '—'}</td><th>展桌名称</th><td>${sel.name || '—'}</td></tr>
        <tr><th>数量</th><td>${sel.quantity} 张</td><th>计划入库时间</th><td>${sel.stockDate || '—'}</td></tr>
        <tr><th>成品尺寸</th><td colspan="3">长 ${sel.length || '—'} × 宽 ${sel.width || '—'} × 高 ${sel.height || '—'} mm</td></tr>
        <tr><th>交付格式</th><td colspan="3">${sel.formats.join(' / ') || '—'}</td></tr>
        <tr><th>画面文件</th><td colspan="3">${sel.artwork?.name || '未提供'}</td></tr>
        <tr><th>尺寸图纸</th><td colspan="3">${sel.drawing?.name || '未提供'}</td></tr>
        <tr><th>制作备注</th><td colspan="3" class="note-cell">${sel.note || '无'}</td></tr>
      </tbody></table>
      <div class="confirm-box">
        <h3>供应商确认</h3>
        <p>□ 料号及名称已核对　□ 数量及入库时间可满足　□ 尺寸图纸已核对　□ 画面文件可正常制作</p>
        <p>异常说明：</p><div class="writing-lines"></div>
      </div>
      <div class="signatures"><div>供应商确认签字 / 盖章：<i></i></div><div>确认日期：<i></i></div></div>
      <footer>本确认单须与画面文件、尺寸图纸一并使用，请勿单独依据本页制作。</footer>
    `;
    document.title = `${sel.partNo || '未编号'}_供应商制作确认单`;
    setTimeout(() => window.print(), 200);
    // Restore title after print dialog
    setTimeout(() => { document.title = '展桌资料台｜制作文件管理与供应商确认'; }, 1500);
  },

  render() {
    this.renderList();
    this.renderForm();
    this.updateStats();
  },

  renderList() {
    const list = document.getElementById('recordList');
    const filtered = items.filter(i =>
      `${i.partNo}${i.name}`.toLowerCase().includes(filterText.toLowerCase())
    );
    if (!filtered.length) {
      list.innerHTML = `<div class="no-items">${items.length ? '没有匹配的展桌' : '暂无展桌记录，点击 + 添加'}</div>`;
      return;
    }
    list.innerHTML = filtered.map((item, idx) => `
      <button class="record${item.id === selectedId ? ' active' : ''}" onclick="app.selectItem('${item.id}')">
        <span class="record-index">${String(idx + 1).padStart(2, '0')}</span>
        <span class="record-copy">
          <strong>${item.name || '未命名展桌'}</strong>
          <small>${item.partNo || '待填写料号'}</small>
        </span>
        <span class="status-dot${isComplete(item) ? ' ready' : ''}"></span>
      </button>
    `).join('');
  },

  renderForm() {
    const sel = this.selected;
    if (!sel) {
      document.getElementById('formPanel').style.display = 'none';
      return;
    }
    document.getElementById('formPanel').style.display = '';

    document.getElementById('formTitle').textContent = sel.name || '新建展桌';
    document.getElementById('fPartNo').value = sel.partNo || '';
    document.getElementById('fName').value = sel.name || '';
    document.getElementById('fQuantity').value = sel.quantity || 1;
    document.getElementById('fStockDate').value = sel.stockDate || '';
    document.getElementById('fLength').value = sel.length || '';
    document.getElementById('fWidth').value = sel.width || '';
    document.getElementById('fHeight').value = sel.height || '';
    document.getElementById('fNote').value = sel.note || '';

    // Format buttons
    document.querySelectorAll('#formatOptions button').forEach(btn => {
      const fmt = btn.dataset.fmt;
      const selected = sel.formats.includes(fmt);
      btn.className = selected ? 'selected' : '';
      btn.querySelector('i').textContent = selected ? '✓' : '';
    });

    // Upload cards
    this.renderUploadCard('artwork', sel.artwork, '仅 AI 格式');
    this.renderUploadCard('drawing', sel.drawing, '仅 PDF 格式');

    this.updateBadge();
  },

  renderUploadCard(kind, file, hint) {
    const card = document.getElementById(kind + 'Card');
    const icon = document.getElementById(kind + 'Icon');
    const link = document.getElementById(kind + 'Link');
    const small = document.getElementById(kind + 'Hint');
    const remove = document.getElementById(kind + 'Remove');

    card.className = 'upload-card' + (file ? ' has-file' : '');
    icon.textContent = file ? '✓' : '＋';

    if (file) {
      small.style.display = 'none';
      link.style.display = 'block';
      link.href = file.dataUrl || '#';
      link.textContent = file.name;
      link.download = file.name;
      remove.style.display = '';
    } else {
      small.style.display = 'block';
      small.textContent = hint;
      link.style.display = 'none';
      remove.style.display = 'none';
    }
  },

  updateStats() {
    const total = items.length;
    const complete = items.filter(isComplete).length;
    const missing = items.reduce((c, i) => c + (i.artwork ? 0 : 1) + (i.drawing ? 0 : 1), 0);
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statComplete').textContent = complete;
    document.getElementById('statMissing').textContent = missing;
    document.getElementById('statMissingWrap').className = missing ? 'warn' : '';
  },

  updateBadge() {
    const sel = this.selected;
    const badge = document.getElementById('formBadge');
    if (!sel) return;
    const ok = isComplete(sel);
    badge.textContent = ok ? '可提交' : '填写中';
    badge.className = 'badge' + (ok ? ' complete' : '');
  },

  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timeout);
    el._timeout = setTimeout(() => el.classList.remove('show'), 2000);
  }
};

document.addEventListener('DOMContentLoaded', () => app.init());
</script>
</body>
</html>
